# ReflectDesktop 跨平台发布构建器。
#
# 仅由 `git push --tags v*` 触发。在三个操作系统上并行构建原生安装包，
# 上传产物到 workflow run，并（若 tag 形如发布版本）附加到 GitHub Release。
#
# 本地一次性构建不需要它 —— 请改用 `bash scripts/build.sh`。
# 本 workflow 有意对分支推送保持禁用：日常工作不会触发它。

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:    # 从 Actions 页签手动触发

permissions:
  contents: write       # softprops/action-gh-release 上传资产所需

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 覆盖三个操作系统的单一 matrix job。每个 runner 只产出
  # 自己系统的原生安装包 —— 不做交叉编译（Tauri 无法
  # 可靠支持交叉编译）。
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: build (${{ matrix.os }} / ${{ matrix.bundles }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-arm64
            runner: macos-14
            bundles: app,dmg
          - os: macos-x86_64
            runner: macos-13
            bundles: app,dmg
          - os: linux
            runner: ubuntu-22.04
            bundles: deb,appimage
          - os: windows
            runner: windows-latest
            bundles: msi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # Linux：Tauri 运行时依赖（webkit2gtk-4.1、appindicator、librsvg）。
      # 名称与 src-tauri/tauri.conf.json bundle.linux.deb.depends 对齐。
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install frontend deps
        run: pnpm install
        # 注意：本仓库 gitignore 了 pnpm-lock.yaml，因此有意
        # 不传 --frozen-lockfile。lockfile 将被重新生成。

      - name: Build native bundles
        # --no-frontend：pnpm tauri build 的 beforeBuildCommand 已运行
        # `pnpm build`；在 CI runner 上跑两次是浪费。
        run: bash scripts/build.sh --bundles=${{ matrix.bundles }} --no-frontend
        # Windows runner 在 GHA 中默认没有 bash，但 windows-latest
        # 预装了 Git Bash，是带 `bash` 前缀的 `run:` 步骤的默认 shell。

      - name: Locate artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # 将 Tauri 产出的所有安装包文件收集到扁平暂存目录。
          find target/release/bundle -type f \( \
            -name '*.dmg' -o \
            -name '*.app' -o \
            -name '*.deb' -o \
            -name '*.AppImage' -o \
            -name '*.msi' -o \
            -name '*.exe' \) -print -exec cp {} artifacts/ \;
          echo "暂存产物列表："
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: reflect-desktop-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # 发布上传：仅在所有 matrix job 成功后运行，且仅在
  # 由 tag 推送触发时。手动 dispatch 只暂存产物。
  # ─────────────────────────────────────────────────────────────────────
  release:
    name: attach to release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded
        run: ls -la release-assets/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
