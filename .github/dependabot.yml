# GitHub Dependabot 配置。
#
# 监控 cargo 依赖与 GitHub Actions 版本,每周一自动提 PR。
# 注意:前端 pnpm-lock.yaml 目前被 gitignore,dependabot 的 npm
# ecosystem 无锁文件可依据,故暂不配置;待提交 lockfile 后再补。

version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # 自动 rebase Dependabot PR,减少维护负担
    rebase-strategy: "auto"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cargo"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    rebase-strategy: "auto"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
