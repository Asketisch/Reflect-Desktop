[package]
name = "reflect-app-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reflect Desktop 领域服务层：activity / kms / media / squad / side-channel / tailscale / autopilot 等命令逻辑（UI 无关，供 src-tauri 复用）"

[lints]
workspace = true

[lib]
name = "reflect_app_core"
path = "src/lib.rs"

[dependencies]
# Reflect crates（仅保留保留模块实际使用的）
reflect-protocol = { workspace = true }
reflect-task     = { workspace = true }

# 通用
dirs        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = ["sync", "rt", "macros", "process", "io-util"] }
tokio-util  = { workspace = true, features = ["rt"] }
parking_lot = { workspace = true }
tracing     = { workspace = true }
tempfile    = "3"
