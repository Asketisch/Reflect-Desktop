<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" width="1280" height="1280">
  <rect width="100%" height="100%" fill="#0b0e14"/>
  <text x="40" y="56" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#e6e9ef">Settings › Display</text>
  <text x="40" y="80" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#828c9f">ReflectDesktop • dark theme • accent=#60a5fa</text>
  
    <rect x="40" y="100" width="1200" height="460" rx="8"
          fill="#11151f" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="64" y="134" font-family="Inter, system-ui, sans-serif"
          font-size="14" font-weight="600" fill="#e6e9ef">Theme</text>
    <foreignObject x="64" y="150" width="1152" height="390">
      
<div xmlns="http://www.w3.org/1999/xhtml" style="font:13px Inter,system-ui,sans-serif;color:#a4adbe;line-height:1.5;">
  <p style="margin:0 0 18px 0;">Choose how the app looks. &quot;System&quot; follows your OS preference.</p>
  <div style="display:inline-flex;gap:6px;padding:4px;background:#0d1119;border:1px solid rgba(255,255,255,0.06);border-radius:6px;">
    <rect x="24" y="6" width="120" height="38" rx="6" fill="#0d1119" stroke="rgba(255,255,255,0.10)"/><text x="84" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#a4adbe">System</text><rect x="154" y="6" width="120" height="38" rx="6" fill="rgba(96,165,250,0.14)" stroke="rgba(96,165,250,0.38)"/><text x="214" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#60a5fa">Dark</text><rect x="284" y="6" width="120" height="38" rx="6" fill="#0d1119" stroke="rgba(255,255,255,0.10)"/><text x="344" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#a4adbe">Light</text>
  </div>
</div>

    </foreignObject>
    
    <rect x="40" y="576" width="1200" height="200" rx="8"
          fill="#11151f" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="64" y="610" font-family="Inter, system-ui, sans-serif"
          font-size="14" font-weight="600" fill="#e6e9ef">Accent color</text>
    <foreignObject x="64" y="626" width="1152" height="130">
      
<div xmlns="http://www.w3.org/1999/xhtml" style="font:13px Inter,system-ui,sans-serif;color:#a4adbe;line-height:1.5;">
  <p style="margin:0 0 16px 0;">Choose the color used for highlights, links, and focus rings.</p>
  <div style="display:flex;align-items:center;gap:12px;position:relative;height:32px;width:280px;">
    <div style="position:absolute;left:0px;top:0;width:28px;height:28px;border-radius:14px;background:#5dd1c6;box-shadow:0 0 0 1px rgba(255,255,255,0.1);border:2px solid transparent;"></div><div style="position:absolute;left:40px;top:0;width:28px;height:28px;border-radius:14px;background:#60a5fa;box-shadow:0 0 0 1px rgba(255,255,255,0.1);border:3px solid #60a5fa;"></div><div style="position:absolute;left:80px;top:0;width:28px;height:28px;border-radius:14px;background:#a78bfa;box-shadow:0 0 0 1px rgba(255,255,255,0.1);border:2px solid transparent;"></div><div style="position:absolute;left:120px;top:0;width:28px;height:28px;border-radius:14px;background:#f472b6;box-shadow:0 0 0 1px rgba(255,255,255,0.1);border:2px solid transparent;"></div><div style="position:absolute;left:160px;top:0;width:28px;height:28px;border-radius:14px;background:#fb923c;box-shadow:0 0 0 1px rgba(255,255,255,0.1);border:2px solid transparent;"></div><div style="position:absolute;left:200px;top:0;width:28px;height:28px;border-radius:14px;background:#4ade80;box-shadow:0 0 0 1px rgba(255,255,255,0.1);border:2px solid transparent;"></div>
  </div>
  <div style="display:flex;align-items:center;gap:12px;margin-top:14px;">
    <div style="width:36px;height:30px;border:1px solid rgba(255,255,255,0.1);border-radius:4px;background:#60a5fa;"></div>
    <code style="font:12px JetBrains Mono,monospace;color:#a4adbe;">#60a5fa</code>
    <button style="margin-left:auto;padding:4px 10px;border-radius:4px;background:transparent;color:#a4adbe;border:1px solid rgba(255,255,255,0.10);font:12px Inter;">Reset</button>
  </div>
</div>

    </foreignObject>
    
    <rect x="40" y="792" width="1200" height="220" rx="8"
          fill="#11151f" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="64" y="826" font-family="Inter, system-ui, sans-serif"
          font-size="14" font-weight="600" fill="#e6e9ef">Transparency</text>
    <foreignObject x="64" y="842" width="1152" height="150">
      
<div xmlns="http://www.w3.org/1999/xhtml" style="font:13px Inter,system-ui,sans-serif;color:#a4adbe;line-height:1.5;">
  <p style="margin:0 0 18px 0;">Let the background image show through app surfaces.</p>
  <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">
    <span style="font:13px Inter,color:#e6e9ef;">Surface opacity</span>
    <svg width="396" height="20" viewBox="0 0 396 20" style="flex:1;">
      <rect x="0" y="8" width="396" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
      <rect x="0" y="8" width="277" height="4" rx="2" fill="#60a5fa"/>
      <circle cx="277" cy="10" r="7" fill="#60a5fa"/>
    </svg>
    <span style="font:12px JetBrains Mono,monospace;color:#828c9f;min-width:34px;text-align:right;">70%</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div style="width:14px;height:14px;border-radius:3px;border:1.5px solid #60a5fa;background:rgba(96,165,250,0.14);"></div>
    <span style="font:13px Inter,color:#e6e9ef;">Reduce transparency</span>
  </div>
</div>

    </foreignObject>
    
    <rect x="40" y="1028" width="1200" height="360" rx="8"
          fill="#11151f" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="64" y="1062" font-family="Inter, system-ui, sans-serif"
          font-size="14" font-weight="600" fill="#e6e9ef">Background image</text>
    <foreignObject x="64" y="1078" width="1152" height="290">
      
<div xmlns="http://www.w3.org/1999/xhtml" style="font:13px Inter,system-ui,sans-serif;color:#a4adbe;line-height:1.5;">
  <p style="margin:0 0 14px 0;">Choose a local image or use an HTTPS image URL.</p>
  <div style="display:flex;gap:10px;margin-bottom:14px;">
    <button style="padding:5px 14px;border-radius:5px;background:#0d1119;color:#e6e9ef;border:1px solid rgba(255,255,255,0.10);font:12px Inter;">Choose image</button>
    <button style="padding:5px 10px;border-radius:5px;background:transparent;color:#a4adbe;border:1px solid rgba(255,255,255,0.10);font:12px Inter;">Clear</button>
  </div>
  <div style="display:flex;gap:8px;">
    <div style="flex:1;padding:6px 12px;border:1px solid rgba(255,255,255,0.10);border-radius:5px;background:#0d1119;color:#e6e9ef;font:12px Inter;">https://example.com/wallpaper.jpg</div>
    <button style="padding:5px 12px;border-radius:5px;background:transparent;color:#a4adbe;border:1px solid rgba(255,255,255,0.10);font:12px Inter;">Apply</button>
  </div>
  <div style="margin-top:14px;height:128px;border-radius:5px;border:1px solid rgba(255,255,255,0.10);background:linear-gradient(135deg, #1e3a8a, #5dd1c6, #60a5fa);"></div>
  <div style="display:flex;align-items:center;gap:14px;margin-top:14px;">
    <span style="font:13px Inter,color:#e6e9ef;">Image strength</span>
    <svg width="396" height="20" viewBox="0 0 396 20" style="flex:1;">
      <rect x="0" y="8" width="396" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
      <rect x="0" y="8" width="158" height="4" rx="2" fill="#60a5fa"/>
      <circle cx="158" cy="10" r="7" fill="#60a5fa"/>
    </svg>
    <span style="font:12px JetBrains Mono,monospace;color:#828c9f;min-width:34px;text-align:right;">40%</span>
  </div>
</div>

    </foreignObject>
    
</svg>
