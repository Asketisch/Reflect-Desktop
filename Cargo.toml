[workspace]
resolver = "2"
members = [
    "vendor/reflect-protocol",
    "vendor/reflect-core",
    "vendor/reflect-tools",
    "vendor/reflect-config",
    "vendor/reflect-rollout",
    "vendor/reflect-llm",
    "vendor/reflect-skills",
    "vendor/reflect-memory",
    "vendor/reflect-hooks",
    "vendor/reflect-permissions",
    "vendor/reflect-stream",
    "vendor/reflect-task",
    "vendor/reflect-agent-def",
    "vendor/reflect-recovery",
    "vendor/reflect-prompt",
    "vendor/reflect-compact",
    "vendor/reflect-async-graph",
    "vendor/reflect-notes",
    "vendor/reflect-ast",
    "vendor/reflect-subagent",
    "vendor/reflect-sandbox",
    "app-core",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/CNB/ReflectDesktop"
authors = ["Reflect Agent Contributors"]

[workspace.dependencies]
# Internal crates (vendored)
reflect-protocol    = { path = "vendor/reflect-protocol" }
reflect-core        = { path = "vendor/reflect-core" }
reflect-tools       = { path = "vendor/reflect-tools" }
reflect-config      = { path = "vendor/reflect-config" }
reflect-rollout     = { path = "vendor/reflect-rollout" }
reflect-llm         = { path = "vendor/reflect-llm" }
reflect-skills      = { path = "vendor/reflect-skills" }
reflect-memory      = { path = "vendor/reflect-memory" }
reflect-hooks       = { path = "vendor/reflect-hooks" }
reflect-permissions = { path = "vendor/reflect-permissions" }
reflect-stream      = { path = "vendor/reflect-stream" }
reflect-task        = { path = "vendor/reflect-task" }
reflect-agent-def   = { path = "vendor/reflect-agent-def" }
reflect-recovery    = { path = "vendor/reflect-recovery" }
reflect-prompt      = { path = "vendor/reflect-prompt" }
reflect-compact     = { path = "vendor/reflect-compact" }
reflect-async-graph = { path = "vendor/reflect-async-graph" }
reflect-notes       = { path = "vendor/reflect-notes" }
reflect-ast         = { path = "vendor/reflect-ast" }
reflect-subagent    = { path = "vendor/reflect-subagent" }
reflect-sandbox     = { path = "vendor/reflect-sandbox" }
reflect-app-core    = { path = "app-core" }

# Common externals
tokio              = { version = "1", features = ["full"] }
tokio-util         = "0.7"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
async-trait        = "0.1"
anyhow             = "1"
thiserror          = "1"
clap               = { version = "4", features = ["derive"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures            = "0.3"
uuid               = { version = "1", features = ["v4", "serde"] }
chrono             = { version = "0.4", features = ["serde"] }
parking_lot        = "0.12"
schemars           = "0.8"
once_cell          = "1"
wiremock           = "0.6"
insta              = { version = "1", features = ["yaml"] }

# Tauri 2 stack (used only by src-tauri)
tauri              = { version = "2", features = [] }
tauri-build        = { version = "2", features = [] }

# LLM/Tools
walkdir            = "2"
ignore             = "0.4"
similar            = "2"
regex              = "1"
globset            = "0.4"
url                = "2"

# ReflectAgent-only deps (still in workspace; harmless to keep)
serde_yaml         = "0.9"
toml               = "0.8"
pyo3               = "0.23"
eventsource-stream = "0.2"
rankfns            = "0.1"
htmd               = "0.5"
minijinja          = "2"
sled               = "0.34"
ratatui            = "0.29"
crossterm          = "0.28"
color-eyre         = "0.6"
filetime           = "0.2"
lsp-types          = { version = "=0.97", default-features = false }
rmcp               = { version = "=1.7.0" }
reqwest            = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
opentelemetry         = "0.27"
opentelemetry_sdk     = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp    = { version = "0.27", features = ["http-proto", "reqwest-client", "trace"] }
tracing-opentelemetry = "0.28"
pollster           = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
incremental = true

[profile.test]
debug = 1
codegen-units = 256
