[package]
name = "reflect-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ReflectDesktop：Reflect Agent 的 Tauri 2 桌面 GUI（二进制：reflect-desktop）"

# 子目录 workspace 成员；必须显式发现 tauri-build。
build = "build.rs"

[lib]
name = "reflect_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "reflect-desktop"
path = "src/main.rs"

[dependencies]
tauri                       = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
# tokio-util:CancellationToken 公开 getter(state.rs::cancel_token)需要 sync 模块。
tokio-util                  = { workspace = true }
tauri-plugin-global-shortcut = "2"
# 原生目录选择对话框（WorkspacesView「打开项目目录」），仅 Rust 侧调用，
# 不经 JS IPC，因此无需 dialog capability。
tauri-plugin-dialog          = "2"
serde                       = { workspace = true }
reqwest                    = { workspace = true }
serde_json                  = { workspace = true }
serde_yaml                  = { workspace = true }
tokio                       = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
anyhow                      = { workspace = true }
tracing                     = { workspace = true }
tracing-subscriber          = { workspace = true }
parking_lot                 = { workspace = true }
reflect-protocol            = { workspace = true }
reflect-core                = { workspace = true }
reflect-app-core            = { workspace = true }
reflect-config              = { workspace = true }
reflect-rollout             = { workspace = true }
reflect-skills              = { workspace = true }
reflect-memory              = { workspace = true }
reflect-permissions         = { workspace = true }
reflect-tools               = { workspace = true }
reflect-llm                 = { workspace = true }
reflect-hooks               = { workspace = true }
# 阶段 3d:MCP / LSP 运行时接入。
reflect-mcp                 = { workspace = true }
reflect-lsp                 = { workspace = true }
# LSP 预热:file:// URI 构造(url)与 lsp_types::Uri(与 reflect-lsp 同版本)。
url                         = { workspace = true }
lsp-types                   = { workspace = true }
# v1.x 会话持久化:`reflect::m4_bootstrap::build_default_m4` 给 GUI 接
# 完整 M4(skills/memory/compaction/notes),与 CLI/TUI 行为对齐。仅依赖
# tokio,无 pyo3/hyper 等重 crate。
reflect                     = { workspace = true }
# 多 agent 协调:Task/Team/Coordinator(reflect-agent/crates/orchestration/reflect-task 已实现 TaskManager 全套 API)。
# Phase 1 暴露命令面;UI 与 hook/event_sink 注入留后续阶段。
reflect-task                = { workspace = true }
# Schedule(cron):reflect-agent/crates/integrations/reflect-stream 的 CronScheduler(create/update/delete/tick)。
# Phase 1 第 2 项暴露命令面;后台 driver 与持久化留后续。
reflect-stream              = { workspace = true }
# Agent definitions:reflect-agent/crates/abilities/reflect-agent-def 的 Markdown + frontmatter 解析/加载。
# Phase 1 第 3 项:agent profile 管理页(列表/创建/编辑/删除)。
reflect-agent-def           = { workspace = true }
# 阶段 1:真实 agent 集成所需 — sanitizer / 工具输出脱敏(默认 10 pattern)。
# Sanitizer::with_defaults() 直接可用,无需 reflect-config 的 SanitizeSection 转换。
uuid                        = { workspace = true }
futures                     = { workspace = true }
dirs                        = "5"
# 阶段 2:config 读写命令(to_string_pretty / load_from_str 校验)。
toml                        = { workspace = true }
once_cell                   = { workspace = true }
# Phase 3 item 13：Media Studio（图像解码 / 缩放 / 格式转换）
# + Computer Use（xcap 截屏 + enigo 鼠标键盘）。
# 纯本地依赖 — reflect-agent 核心 crate（submodule）不动。
image                       = { workspace = true }
xcap                        = { workspace = true }
enigo                       = { workspace = true }

# 仅 macOS 的 dock 徽标：通过 objc2 设置 NSApplication.dockTile.badgeLabel。
[target.'cfg(target_os = "macos")'.dependencies]
objc2            = "0.5"
objc2-app-kit    = { version = "0.2", features = ["NSApplication", "NSDockTile"] }
objc2-foundation = { version = "0.2", features = ["NSString"] }

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
tokio-util = { workspace = true }
tempfile = "3"
chrono = { workspace = true }
